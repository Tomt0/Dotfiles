general {
    lock_cmd = ~/.config/viegphunt/lock.sh
    before_sleep_cmd = ~/.config/viegphunt/lock.sh
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 300
    on-timeout = ~/.config/viegphunt/lock.sh
}

listener {
    timeout = 420
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 600
    on-timeout = systemctl suspend
}
