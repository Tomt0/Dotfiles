# Ignore maximize requests from apps. You'll probably like this.
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Disable blur for floating XWayland window
windowrule = no_blur on, match:class xwayland:1, match:float true

# Bluetooth manager — small floating window
windowrule {
    name = float-blueman
    match:class = ^(blueman-manager)$
    float = true
    size = 680 500
    center = true
}

# Audio mixer — small floating window
windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol)$
    float = true
    size = 800 500
    center = true
}
