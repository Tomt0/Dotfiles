background {
    monitor =
    path = ~/.cache/hyprlock_wallpaper
    blur_passes = 3
    blur_size = 6
}

input-field {
    size = 600, 110
    outline_thickness = 2
    dots_size = 0.3
    dots_center = true
    inner_color = rgba(255, 255, 255, 0.1)
    outer_color = rgba(255, 255, 255, 0.4)
    font_color = rgb(255, 255, 255)
    hide_input = false
    rounding = 10
    check_color = rgb(255, 97, 97)
    fail_color = rgb(255, 97, 97)
    placeholder_text = <i>Password</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(255, 255, 255)
    font_size = 180
    font_family = JetBrainsMono Nerd Font
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 5
    shadow_size = 10
}
